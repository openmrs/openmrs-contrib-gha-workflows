name: Close stale pull requests

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: Days without activity before a pull request is labelled stale and receives `stale-pr-message`.
        type: number
        default: 150
      days-before-close:
        description: >-
          Days after being labelled stale before the pull request is closed with `close-pr-message`.
          Removing the stale label or new activity resets the count.
        type: number
        default: 30
      stale-pr-message:
        description: >-
          Comment posted when a pull request is labelled stale. `{time-before-stale}`, `{time-before-close}` and
          `{inactive-time-at-close}` are replaced with `days-before-stale`, `days-before-close` and their sum,
          written like "5 months" or "a month".
        type: string
        default: |
          **tl;dr** our action detected no activity on this PR and will close it in {time-before-close} if the stale label is not removed.

          OpenMRS welcomes your contribution! It means a lot to us that you want to contribute to equity in healthcare!

          This PR has not seen any activity in the last {time-before-stale}. That is why we wanted to check whether you are still working on it or need assistance from our side.
          Please note that this is an automated message and we might very well be the reason why there has not been any activity lately. We certainly do not want to discourage you from contributing. We do need to be honest in that OpenMRS has limited resources for reviewing PRs.

          If you do not have time to continue the work or have moved on you don’t need to do anything. We will automatically close the PR in {time-before-close}. We hope to see you back soon :)
          If you would like to continue working on it or require help from us please remove the stale label and respond by commenting on the issue.
      close-pr-message:
        description: >-
          Comment posted when a stale pull request is closed. Supports the same placeholders as `stale-pr-message`.
        type: string
        default: |
          **tl;dr** closing this PR since it has not seen any activity in the last {inactive-time-at-close}.

          OpenMRS welcomes your contribution! It means a lot to us that you want to contribute to equity in healthcare! We certainly do not want to discourage you from contributing. We do need to be honest in that OpenMRS has limited resources for reviewing PRs. Your PR has not seen any activity in the last {inactive-time-at-close}. This is why we have decided to close this PR for now. This allows us OpenMRS reviewers to focus our limited time to review all other PRs in a timely and professional manner.

          Please feel free to reassign yourself to the issue you worked on in our JIRA when you have time to focus on it. After that reopen a new PR and we will be glad to work with you to get your contribution merged. Thank you very much for your help and understanding :)

jobs:
  stale:
    name: Close stale pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: Render comment templates
        id: messages
        env:
          DAYS_BEFORE_STALE: ${{ inputs.days-before-stale }}
          DAYS_BEFORE_CLOSE: ${{ inputs.days-before-close }}
          STALE_PR_MESSAGE: ${{ inputs.stale-pr-message }}
          CLOSE_PR_MESSAGE: ${{ inputs.close-pr-message }}
        run: python3 .gha-workflows/.github/scripts/render_stale_messages.py

      - name: Label and close stale pull requests
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ github.token }}
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: ${{ inputs.days-before-stale }}
          days-before-pr-close: ${{ inputs.days-before-close }}
          stale-pr-message: ${{ steps.messages.outputs.stale-pr-message }}
          close-pr-message: ${{ steps.messages.outputs.close-pr-message }}
