name: Release OpenMRS Frontend Module


on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use. If omitted, inferred from engines.node in package.json.'
        type: string
      build_command:
        description: 'Command to build the project. If omitted, inferred from package.json.'
        type: string
        default: ''
      enable_turborepo_cache:
        description: >-
          Deprecated and ignored. Publishing builds always run uncached so that what reaches
          the registry is built from the release tree. Retained so existing callers that pass
          it keep validating; remove it from your workflow at your convenience.
        type: string
        default: ''
      pre_release_version_command:
        description: >-
          Command to set the pre-release version.
          Available env vars: PRERELEASE_VERSION (e.g., 1.2.4-pre.42), GITHUB_RUN_NUMBER.
          If omitted, inferred from package.json.
        type: string
        default: ''
      pre_release_publish_command:
        description: 'Command to publish a pre-release from the default branch. If omitted, inferred from package.json.'
        type: string
        default: ''
      pre_release_patch_publish_command:
        description: 'Command to publish a pre-release from a patch branch. If empty, patch branch publishing is skipped.'
        type: string
        default: ''
      release_publish_command:
        description: >-
          Command to publish a release. If omitted, inferred from package.json. In tagged-release
          mode a failed publish is retried, so a monorepo command should pass --tolerate-republish
          to `yarn npm publish`; otherwise a retry stops at the first package that already went out.
        type: string
        default: ''
      verify_command:
        description: >-
          Command run on the release tree before the release commit and tag are pushed
          (tagged-release mode). If omitted, inferred from package.json.
        type: string
        default: ''
      support_patch_branches:
        description: 'Whether to support patch/* branches for pre-releases'
        type: boolean
        default: false
      publish:
        description: >-
          Whether to publish to npm. Defaults to true in the openmrs org and false elsewhere, so forks
          that inherit a caller workflow do not publish; outside the openmrs org, set it from an
          expression such as `github.repository_owner == 'my-org'`. When false, pre-releases are
          skipped and releases refuse to run. When true, publishing
          fails unless NPM_AUTH_TOKEN is set or the caller grants `id-token: write` for npm trusted
          publishing.
        type: boolean
        default: ${{ github.repository_owner == 'openmrs' }}
      npm_registry_url:
        description: >-
          Registry to publish to, overriding `npmPublishRegistry` in .yarnrc.yml. Scoped registries
          (`npmScopes`) and `publishConfig.registry` still take precedence. If omitted, Yarn's
          configuration decides. Tested against npmjs only.
        type: string
        default: ''
      turbo_concurrency:
        description: >-
          Turborepo --concurrency for the inferred build and verify commands. Not added where the
          repo's own script already sets it. Empty for none.
        type: string
        default: '5'
      trigger_downstream_build:
        description: >-
          Whether to dispatch `downstream_workflow` in `downstream_repository` after a pre-release
          from the default branch. Without `downstream_repository`, repos in the openmrs org trigger
          the Reference Application frontend build and other repos trigger nothing.
        type: boolean
        default: true
      trigger_refapp_build:
        description: 'Deprecated alias for trigger_downstream_build. Setting either to false disables the trigger.'
        type: boolean
        default: true
      downstream_repository:
        description: 'Repository (owner/name) whose workflow is dispatched after a pre-release from the default branch.'
        type: string
        default: ''
      downstream_workflow:
        description: 'Workflow file name or ID to dispatch in downstream_repository. Required when downstream_repository is set.'
        type: string
        default: ''
      artifact_path:
        description: 'Path(s) to build artifacts to upload (glob supported). If omitted, inferred from package.json.'
        type: string
        default: ''
      release_type:
        description: >-
          Version bump: `patch`, `minor` or `major`, applied to the version in the root
          package.json. Ignored when `release_version` is set. Setting either input cuts a
          tagged release, mirroring release-backend-module.yml: bump versions, commit, tag,
          push, publish to npm and create a GitHub Release with generated notes. When both are
          empty the workflow pre-releases on push and, for callers still triggered by
          `release: created`, publishes the GitHub Release's tag (legacy mode).
        type: string
        default: ''
      release_version:
        description: 'Exact version to release (e.g., 12.4.0, or 12.4.0-beta.1 to publish to `next`). When set, overrides release_type.'
        type: string
        default: ''
      publish_only:
        description: >-
          Finish a release whose publish failed after the tag was already pushed and could not be
          rolled back automatically (e.g. some packages were published). Skips the bump, commit
          and push entirely: checks out the existing tag for `release_version`, builds it and
          publishes to npm. Requires `release_version`; `release_type` is ignored.
        type: boolean
        default: false
      release_version_command:
        description: >-
          Command to set the release version. Available env var: RELEASE_VERSION, which holds either
          a strategy (patch/minor/major) or an exact version; the command must accept both, as
          `yarn version` does.
          If omitted, inferred from package.json.
        type: string
        default: ''
      tag_prefix:
        description: 'Prefix for release tags, stripped to get the version in legacy mode. O3 repos tag as v<version>.'
        type: string
        default: 'v'
      create_github_release:
        description: 'Whether to create a GitHub Release with release notes after publishing (tagged-release mode)'
        type: boolean
        default: true
      git_user_name:
        description: 'Git committer name for release commits (tagged-release mode)'
        type: string
        default: 'openmrs-bot'
      git_user_email:
        description: 'Git committer email for release commits (tagged-release mode)'
        type: string
        default: 'infrastructure@openmrs.org'
      publish_environment:
        description: >-
          GitHub environment for the jobs that publish to npm. Set this to match the environment
          configured on the package's npm trusted publisher, if any.
        type: string
        default: ''
    secrets:
      NPM_AUTH_TOKEN:
        description: 'NPM authentication token for publishing'
        required: false
      APP_ID:
        description: >-
          GitHub App ID. Used for triggering the downstream build (needs actions:write on the
          downstream repository) and, in tagged-release mode, for pushing the release commit and
          tag (needs contents:write on this repo and a place on the ruleset bypass list).
          When set with APP_PRIVATE_KEY, a short-lived App token is preferred over BOT_PAT.
        required: false
      APP_PRIVATE_KEY:
        description: 'Private key for the release bot GitHub App.'
        required: false
      BOT_PAT:
        description: >-
          Legacy GitHub PAT, fallback when App credentials are not provided. Needs actions:write on
          the downstream repository for the downstream build and, in tagged-release mode,
          permission to push past branch protection on this repo.
        required: false

jobs:
  # Outside the openmrs org, publishing names OpenMRS owns on public npm fails
  # (see check_npm_publish_target.py).
  publish_guard:
    name: Check publish target
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release'
      || inputs.release_type != '' || inputs.release_version != ''
      || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        && (github.ref_name == (github.event.repository.default_branch || 'main') || (inputs.support_patch_branches && startsWith(github.ref_name, 'patch/'))))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.repository_owner != 'openmrs'

      - name: Checkout shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: Use the configured npm registry
        if: inputs.npm_registry_url != ''
        env:
          REGISTRY: ${{ inputs.npm_registry_url }}
        run: echo "YARN_NPM_PUBLISH_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: Check publish target
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PUBLISH: ${{ inputs.publish }}
        run: python3 .gha-workflows/.github/scripts/check_npm_publish_target.py

  pre_release:
    name: Pre-release
    needs: publish_guard
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish_environment }}
    # Serialize pre-release publishes so an older run cannot overwrite `next`
    # after a newer pre-release has been published.
    concurrency:
      group: pre-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && inputs.publish
      && inputs.release_type == '' && inputs.release_version == ''
      && (github.ref_name == (github.event.repository.default_branch || 'main') || (inputs.support_patch_branches && startsWith(github.ref_name, 'patch/')))
      && (github.event.head_commit == null
        || !contains(github.event.head_commit.message, '[skip-pre]'))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout inference action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions
            .github/scripts
            .github/tools
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: 🔒 Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: bash .gha-workflows/.github/scripts/verify-npm-credentials.sh

      - name: Use the configured npm registry
        if: inputs.npm_registry_url != ''
        env:
          REGISTRY: ${{ inputs.npm_registry_url }}
        run: echo "YARN_NPM_PUBLISH_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: Infer frontend parameters
        id: params
        uses: ./.gha-workflows/.github/actions/infer-frontend-params
        with:
          node_version: ${{ inputs.node_version }}
          build_command: ${{ inputs.build_command }}
          artifact_path: ${{ inputs.artifact_path }}
          pre_release_version_command: ${{ inputs.pre_release_version_command }}
          pre_release_publish_command: ${{ inputs.pre_release_publish_command }}
          pre_release_patch_publish_command: ${{ inputs.pre_release_patch_publish_command }}
          turbo_concurrency: ${{ inputs.turbo_concurrency }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.params.outputs.node_version }}
          cache: 'yarn'

      - name: 🗂️ Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ steps.params.outputs.node_version }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.params.outputs.node_version }}-modules-

      - name: 📦 Install dependencies
        run: yarn install --immutable

      # The version steps use this pinned semver rather than the repo's, which
      # Plug'n'Play repos cannot `require` from a plain `node`. Installed outside
      # the workspace so the node_modules cache never picks it up.
      - name: 🧰 Install workflow tools
        run: |
          cp -R .gha-workflows/.github/tools "$RUNNER_TEMP/gha-tools"
          npm ci --prefix "$RUNNER_TEMP/gha-tools" --ignore-scripts --no-audit --no-fund

      - name: 🏷️ Compute pre-release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          SUPPORT_PATCH: ${{ inputs.support_patch_branches }}
          RUN_NUMBER: ${{ github.run_number }}
          CURRENT_VERSION_COMMAND: ${{ steps.params.outputs.current_version_command }}
          SEMVER: ${{ runner.temp }}/gha-tools/node_modules/semver
        run: |
          CURRENT_VERSION=$(bash -c "$CURRENT_VERSION_COMMAND")
          BASE_VERSION=$(CURRENT_VERSION="$CURRENT_VERSION" node -e "console.log(require(process.env.SEMVER).inc(process.env.CURRENT_VERSION, 'patch') || '')")
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::Current version '$CURRENT_VERSION' is not semver. Set \"version\" in package.json, or add a ci:current-version script that prints it."
            exit 1
          fi
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ] || [ "$SUPPORT_PATCH" != "true" ]; then
            echo "version=${BASE_VERSION}-pre.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BASE_VERSION}-patch.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏷️ Set pre-release version
        run: ${{ steps.params.outputs.pre_release_version_command }}
        env:
          PRERELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: 🏗️ Run build
        run: ${{ steps.params.outputs.build_command }}

      - name: 🔧 Configure Git
        run: git config user.email "infrastructure@openmrs.org" && git config user.name "OpenMRS CI"

      - name: 💾 Commit version changes
        run: git add -u && git commit -m "Prerelease version" --no-verify

      - name: 📤 Publish pre-release (default branch)
        if: github.ref_name == (github.event.repository.default_branch || 'main')
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then yarn config set npmAuthToken "${NODE_AUTH_TOKEN}"; fi
          ${{ steps.params.outputs.pre_release_publish_command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: 📤 Publish pre-release (patch)
        if: >-
          inputs.support_patch_branches
          && startsWith(github.ref_name, 'patch/')
          && steps.params.outputs.pre_release_patch_publish_command != ''
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then yarn config set npmAuthToken "${NODE_AUTH_TOKEN}"; fi
          ${{ steps.params.outputs.pre_release_patch_publish_command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-packages
          path: ${{ steps.params.outputs.artifact_path }}
          overwrite: true

  deploy:
    name: Trigger deployment
    runs-on: ubuntu-latest
    needs: pre_release
    env:
      HAS_APP_CREDS: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      HAS_CREDS: ${{ (secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '') || secrets.BOT_PAT != '' }}
      PARTIAL_APP_CREDS: ${{ (secrets.APP_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref_name == (github.event.repository.default_branch || 'main')
      && inputs.publish
      && inputs.trigger_downstream_build && inputs.trigger_refapp_build
      && (inputs.downstream_repository != '' || github.repository_owner == 'openmrs')
      && inputs.release_type == '' && inputs.release_version == ''

    steps:
      - name: 🔒 Reject partial App credentials
        if: env.PARTIAL_APP_CREDS == 'true'
        run: |
          echo "::error::APP_ID and APP_PRIVATE_KEY must be set together — got one without the other. Check for a typo in the caller's secret names."
          exit 1

      - name: Resolve downstream workflow
        id: target
        env:
          REPOSITORY: ${{ inputs.downstream_repository }}
          WORKFLOW: ${{ inputs.downstream_workflow }}
        run: |
          # Only openmrs repos reach this step without a repository (see the job's `if`).
          if [ -z "$REPOSITORY" ]; then
            REPOSITORY="openmrs/openmrs-distro-referenceapplication"
            WORKFLOW="build-frontend.yml"
          fi
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::downstream_repository must be in owner/name form (got '$REPOSITORY')"
            exit 1
          fi
          if [ -z "$WORKFLOW" ]; then
            echo "::error::downstream_workflow is required when downstream_repository is set"
            exit 1
          fi
          {
            echo "repository=$REPOSITORY"
            echo "owner=${REPOSITORY%%/*}"
            echo "name=${REPOSITORY#*/}"
            echo "workflow=$WORKFLOW"
          } >> "$GITHUB_OUTPUT"

      - name: 🔒 Verify cross-repo dispatch credentials
        if: env.HAS_CREDS != 'true'
        run: |
          echo "::error::Triggering the downstream build needs cross-repo credentials: set APP_ID + APP_PRIVATE_KEY (preferred) or BOT_PAT. github.token cannot dispatch to another repository."
          exit 1

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: 🚀 Trigger downstream build
        run: gh workflow run "$WORKFLOW" --repo "$REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_PAT }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
          WORKFLOW: ${{ steps.target.outputs.workflow }}

  # Legacy mode: publishes the tag of a GitHub Release created by hand, at the
  # tag's version, to `next` if the Release is a prerelease. Kept until callers
  # move to tagged-release mode and drop `release: created` from their triggers.
  # Releases created by the github_release job below raise no event, so the two
  # modes never both publish the same version.
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish_environment }}

    needs: publish_guard
    if: github.event_name == 'release'

    steps:
      - name: 🔒 Require publishing
        if: ${{ !inputs.publish }}
        run: |
          echo "::error::Releases publish to npm, so they cannot run with publish: false. Outside the openmrs org, publish defaults to false; set publish: true in the caller to release."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout inference action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions
            .github/scripts
            .github/tools
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: 🔒 Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: bash .gha-workflows/.github/scripts/verify-npm-credentials.sh

      - name: Use the configured npm registry
        if: inputs.npm_registry_url != ''
        env:
          REGISTRY: ${{ inputs.npm_registry_url }}
        run: echo "YARN_NPM_PUBLISH_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: Infer frontend parameters
        id: params
        uses: ./.gha-workflows/.github/actions/infer-frontend-params
        with:
          node_version: ${{ inputs.node_version }}
          build_command: ${{ inputs.build_command }}
          artifact_path: ${{ inputs.artifact_path }}
          release_publish_command: ${{ inputs.release_publish_command }}
          release_version_command: ${{ inputs.release_version_command }}
          pre_release_publish_command: ${{ inputs.pre_release_publish_command }}
          turbo_concurrency: ${{ inputs.turbo_concurrency }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.params.outputs.node_version }}
          cache: 'yarn'

      - name: 🗂️ Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ steps.params.outputs.node_version }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.params.outputs.node_version }}-modules-

      - name: 📦 Install dependencies
        run: yarn install --immutable

      # The version steps use this pinned semver rather than the repo's, which
      # Plug'n'Play repos cannot `require` from a plain `node`. Installed outside
      # the workspace so the node_modules cache never picks it up.
      - name: 🧰 Install workflow tools
        run: |
          cp -R .gha-workflows/.github/tools "$RUNNER_TEMP/gha-tools"
          npm ci --prefix "$RUNNER_TEMP/gha-tools" --ignore-scripts --no-audit --no-fund

      # The Release's tag is the version to publish, whether or not package.json
      # was bumped to match before the Release was created.
      - name: 🏷️ Set version from release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          CURRENT_VERSION_COMMAND: ${{ steps.params.outputs.current_version_command }}
          RELEASE_VERSION_COMMAND: ${{ steps.params.outputs.release_version_command }}
          SEMVER: ${{ runner.temp }}/gha-tools/node_modules/semver
        run: |
          TAG_VERSION="${TAG_NAME#"$TAG_PREFIX"}"
          # npm drops build metadata, so v1.2.0+build.5 publishes 1.2.0.
          RELEASE_VERSION=$(TAG_VERSION="$TAG_VERSION" node -p "
            const v = require(process.env.SEMVER).parse(process.env.TAG_VERSION);
            v && v.version + (v.build.length ? '+' + v.build.join('.') : '') === process.env.TAG_VERSION ? v.version : ''
          ")
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::Release tag '$TAG_NAME' is not '$TAG_PREFIX' followed by a semver version. Set tag_prefix if the repo tags differently."
            exit 1
          fi
          CURRENT=$(bash -c "$CURRENT_VERSION_COMMAND")
          if [ "$CURRENT" != "$RELEASE_VERSION" ]; then
            echo "Setting version $CURRENT -> $RELEASE_VERSION from the release tag"
            RELEASE_VERSION="$RELEASE_VERSION" bash -c "$RELEASE_VERSION_COMMAND"
          fi
          echo "- **Version:** \`$RELEASE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 🏗️ Run build
        run: ${{ steps.params.outputs.build_command }}

      # A prerelease goes out like a pre-release build, to `next`, so it never
      # becomes `latest`.
      - name: 📢 Publish release
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then yarn config set npmAuthToken "${NODE_AUTH_TOKEN}"; fi
          bash -eo pipefail -c "$PUBLISH_COMMAND"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          PUBLISH_COMMAND: >-
            ${{ github.event.release.prerelease
                && steps.params.outputs.pre_release_publish_command
                || steps.params.outputs.release_publish_command }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-packages
          path: ${{ steps.params.outputs.artifact_path }}
          overwrite: true

  # ---------------------------------------------------------------------------
  # Tagged-release mode (inputs.release_type or inputs.release_version set). Mirrors
  # release-backend-module.yml: bump -> commit -> tag -> build -> verify -> push ->
  # publish -> GitHub Release with notes.
  #
  # Invariant: nothing reaches npm unless the release tag is on the remote, and a
  # pushed tag is only removed when the registry answers 404 for every one of its
  # packages. A failed publish is retried; if it still fails and npm has nothing at
  # the version, the tag deletion and a revert of the release commit are pushed
  # together.
  # ---------------------------------------------------------------------------
  tagged_release:
    name: Release to npm
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish_environment }}
    # Generous, so the per-step timeouts below fire first: a timed-out step is a
    # failure the recovery steps handle, whereas a job timeout may skip them.
    timeout-minutes: 120
    needs: publish_guard
    if: inputs.release_type != '' || inputs.release_version != ''
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    # No permissions block: inheriting the caller's lets it opt into id-token: write for npm OIDC.
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}
      base_ref: ${{ steps.prev.outputs.base_ref }}
      is_latest: ${{ steps.prev.outputs.is_latest }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    env:
      HAS_APP_CREDS: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      PARTIAL_APP_CREDS: ${{ (secrets.APP_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}
    steps:
      - name: 🔒 Reject partial App credentials
        if: env.PARTIAL_APP_CREDS == 'true'
        run: |
          echo "::error::APP_ID and APP_PRIVATE_KEY must be set together — got one without the other. Check for a typo in the caller's secret names."
          exit 1

      # Checked before the checkout below, whose ref is built from this input.
      - name: 🔒 Validate publish-only request
        if: inputs.publish_only
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -z "$RELEASE_VERSION" ]; then
            echo "::error::publish_only needs release_version — it names the already-tagged version to build and publish."
            exit 1
          fi

      - name: 🔒 Require publishing
        if: ${{ !inputs.publish }}
        run: |
          echo "::error::Tagged releases always publish to npm, so they cannot run with publish: false. Outside the openmrs org, publish defaults to false; set publish: true in the caller to release."
          exit 1

      - name: Resolve branch
        id: branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Releases are only cut from the default branch for now. Releasing from
          # other branches needs a non-`latest` npm dist-tag, which isn't handled yet.
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Releases can only be cut from '$DEFAULT_BRANCH' (this run is on '$REF_NAME'). Pick '$DEFAULT_BRANCH' in the 'Use workflow from' dropdown."
            exit 1
          fi
          echo "name=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "- **Target Branch:** \`$DEFAULT_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Publish-only builds the released tree, not the branch tip, which may
          # have moved on since the tag was cut.
          ref: >-
            ${{ inputs.publish_only
                && format('refs/tags/{0}{1}', inputs.tag_prefix, inputs.release_version)
                || steps.branch.outputs.name }}
          token: ${{ steps.app-token.outputs.token || secrets.BOT_PAT || github.token }}

      - name: Checkout inference action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions
            .github/scripts
            .github/tools
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: 🔒 Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: bash .gha-workflows/.github/scripts/verify-npm-credentials.sh

      - name: Use the configured npm registry
        if: inputs.npm_registry_url != ''
        env:
          REGISTRY: ${{ inputs.npm_registry_url }}
        run: echo "YARN_NPM_PUBLISH_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: Infer frontend parameters
        id: params
        uses: ./.gha-workflows/.github/actions/infer-frontend-params
        with:
          node_version: ${{ inputs.node_version }}
          build_command: ${{ inputs.build_command }}
          artifact_path: ${{ inputs.artifact_path }}
          release_publish_command: ${{ inputs.release_publish_command }}
          release_version_command: ${{ inputs.release_version_command }}
          pre_release_publish_command: ${{ inputs.pre_release_publish_command }}
          verify_command: ${{ inputs.verify_command }}
          turbo_concurrency: ${{ inputs.turbo_concurrency }}

      # `run: ${{ ... }}` with an empty value is a no-op step that PASSES. If the
      # inference action resolves a command to nothing (checked out from the wrong
      # ref, or too old to provide it), the release would tag without bumping, or
      # push a tag having published nothing. Fail here instead.
      - name: Verify inferred commands
        env:
          BUILD_COMMAND: ${{ steps.params.outputs.build_command }}
          RELEASE_VERSION_COMMAND: ${{ steps.params.outputs.release_version_command }}
          RELEASE_PUBLISH_COMMAND: ${{ steps.params.outputs.release_publish_command }}
          VERIFY_COMMAND: ${{ steps.params.outputs.verify_command }}
          CURRENT_VERSION_COMMAND: ${{ steps.params.outputs.current_version_command }}
        run: |
          STATUS=0
          for NAME in BUILD_COMMAND RELEASE_VERSION_COMMAND RELEASE_PUBLISH_COMMAND VERIFY_COMMAND CURRENT_VERSION_COMMAND; do
            if [ -z "${!NAME}" ]; then
              echo "::error::infer-frontend-params resolved $NAME to an empty string. Is the action checked out at the right ref, and new enough to provide it?"
              STATUS=1
            fi
          done
          exit $STATUS

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.params.outputs.node_version }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      # The version steps use this pinned semver rather than the repo's, which
      # Plug'n'Play repos cannot `require` from a plain `node`. Installed outside
      # the workspace so the node_modules cache never picks it up.
      - name: 🧰 Install workflow tools
        run: |
          cp -R .gha-workflows/.github/tools "$RUNNER_TEMP/gha-tools"
          npm ci --prefix "$RUNNER_TEMP/gha-tools" --ignore-scripts --no-audit --no-fund

      - name: 🔧 Configure Git
        if: ${{ !inputs.publish_only }}
        env:
          GIT_USER_NAME: ${{ inputs.git_user_name }}
          GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Resolve release argument
        if: ${{ !inputs.publish_only }}
        id: arg
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.release_version }}
          CURRENT_VERSION_COMMAND: ${{ steps.params.outputs.current_version_command }}
        run: |
          # A custom version, when given, overrides the release type.
          if [ -n "$CUSTOM_VERSION" ]; then
            ARG="$CUSTOM_VERSION"
            LABEL="custom"
          else
            case "$RELEASE_TYPE" in
              patch|minor|major) ARG="$RELEASE_TYPE"; LABEL="$RELEASE_TYPE" ;;
              *)
                echo "::error::release_type must be patch, minor or major (got '$RELEASE_TYPE'), or set release_version"
                exit 1 ;;
            esac
          fi
          echo "value=$ARG" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          CURRENT=$(bash -c "$CURRENT_VERSION_COMMAND")
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read the current version. Set \"version\" in package.json, or add a ci:current-version script that prints it."
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      # The version command accepts a strategy (patch/minor/major) or an exact
      # version, the same as `yarn release <type|version>` locally.
      - name: 🏷️ Set release version
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_VERSION: ${{ steps.arg.outputs.value }}
        run: ${{ steps.params.outputs.release_version_command }}

      - name: 🔍 Read back release version
        if: ${{ !inputs.publish_only }}
        id: bump
        env:
          RELEASE_TYPE: ${{ steps.arg.outputs.label }}
          OLD: ${{ steps.arg.outputs.current }}
          CURRENT_VERSION_COMMAND: ${{ steps.params.outputs.current_version_command }}
          SEMVER: ${{ runner.temp }}/gha-tools/node_modules/semver
        run: |
          NEW=$(bash -c "$CURRENT_VERSION_COMMAND")
          if [ "$(NEW="$NEW" node -p "require(process.env.SEMVER).valid(process.env.NEW) || ''")" != "$NEW" ] || [[ "$NEW" == *+* ]]; then
            echo "::error::Version after bump is '$NEW', expected semver like 12.4.0 or 12.4.0-beta.1 (no 'v' prefix, no build metadata)"
            exit 1
          fi
          if [ "$(NEW="$NEW" node -p "require(process.env.SEMVER).gt(process.env.NEW, process.env.OLD)")" != "true" ]; then
            echo "::error::New version $NEW is not greater than current version $OLD"
            exit 1
          fi
          {
            echo "version=$NEW"
            echo "old_major=${OLD%%.*}"
            echo "new_major=${NEW%%.*}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release Parameters 🚀"
            echo "- **Release Type:** \`$RELEASE_TYPE\`"
            echo "- **Version:** \`$OLD\` → \`$NEW\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔗 Bump internal peer ranges for major release
        if: ${{ !inputs.publish_only && steps.bump.outputs.old_major != steps.bump.outputs.new_major }}
        env:
          NEW_MAJOR: ${{ steps.bump.outputs.new_major }}
        run: |
          python3 .gha-workflows/.github/scripts/bump_internal_peer_ranges.py
          yarn install --mode=update-lockfile

      # The one place the effective version is settled: the bump's result
      # normally, or the input naming the existing tag in publish-only mode.
      # Everything downstream reads steps.tag.outputs.version.
      - name: Compute release tag name
        id: tag
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version || inputs.release_version }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          TAG_NAME="${TAG_PREFIX}${RELEASE_VERSION}"
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          # Pre-release versions (e.g. 12.4.0-beta.1) publish to `next`, not `latest`.
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PUBLISH_ONLY" = "true" ]; then
            # The bump step writes this header in a normal run.
            {
              echo "### Release Parameters 🚀"
              echo "- **Mode:** \`publish-only\` — no bump, commit or push"
              echo "- **Version:** \`$RELEASE_VERSION\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tag does not exist
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists. Release aborted to prevent overwriting."
            exit 1
          fi

      - name: Resolve previous release tag
        id: prev
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Base for release notes: the latest stable release older than this one,
          # so a patch-branch release doesn't diff against a newer main-line tag.
          # The selector already tolerates an optional leading `v`, so strip a
          # plain `v` prefix and let it match both `v1.2.3` and `1.2.3` tags.
          # Also decides is_latest, so publish-only on an old tag can't take the
          # Latest badge from a newer release.
          if [ "$TAG_PREFIX" = "v" ]; then TAG_PREFIX=""; fi
          git tag --list "${TAG_PREFIX}*" \
            | TAG_PREFIX="$TAG_PREFIX" python3 .gha-workflows/.github/scripts/select_previous_release.py

      - name: 💾 Commit and tag
        id: commit
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          # The release commit is pushed to the default branch and triggers a pre-release like
          # any other push, which moves `next` past the version being released.
          git add -u
          git commit -m "(chore) Release ${RELEASE_TAG}" --no-verify
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 🏗️ Run build
        timeout-minutes: 30
        run: ${{ steps.params.outputs.build_command }}

      - name: 🧪 Verify release tree
        if: ${{ !inputs.publish_only }}
        timeout-minutes: 30
        run: ${{ steps.params.outputs.verify_command }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event.repository.name }}-packages
          path: ${{ steps.params.outputs.artifact_path }}
          overwrite: true

      # Publish must directly follow the push: the failure steps below treat "tag
      # pushed, publish not successful" as a release that may need rolling back.
      - name: ⬆️ Push release commit and tag
        id: push
        if: ${{ !inputs.publish_only }}
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          # Push before publishing: npm versions are immutable, so a failed push
          # after a publish would leave an untagged version on the registry.
          # --atomic makes the branch and tag land together or not at all.
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$RELEASE_TAG"

      - name: 📢 Publish release
        id: publish
        timeout-minutes: 20
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          PUBLISH_COMMAND: >-
            ${{ steps.tag.outputs.prerelease == 'true'
                && steps.params.outputs.pre_release_publish_command
                || steps.params.outputs.release_publish_command }}
          PUBLISH_LOG: ${{ runner.temp }}/published.txt
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then yarn config set npmAuthToken "${NODE_AUTH_TOKEN}"; fi
          for ATTEMPT in 1 2 3; do
            if bash -eo pipefail -c "$PUBLISH_COMMAND"; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "::warning::Publish attempt $ATTEMPT failed; retrying in $((ATTEMPT * 30))s"
              sleep $((ATTEMPT * 30))
            fi
          done
          echo "::error::Publish failed after 3 attempts"
          exit 1

      # Establishes what a failed run left behind, including whether a push step
      # that did not succeed landed anyway, and whether it is safe to roll back.
      # Unknown state blocks the rollback.
      - name: 🔍 Check release state
        id: state
        if: >-
          (failure() || cancelled())
          && steps.tag.outputs.name != ''
          && (steps.commit.outcome == 'success' || inputs.publish_only)
          && steps.publish.outcome != 'success'
        timeout-minutes: 10
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          PUBLISH_LOG: ${{ runner.temp }}/published.txt
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          PUBLISH_RAN: ${{ steps.publish.outcome == 'failure' || steps.publish.outcome == 'cancelled' }}
          STATE_FILE: ${{ runner.temp }}/release-state.json
        run: python3 .gha-workflows/.github/scripts/assess_release_state.py

      # The App token from the start of the job may have expired by now.
      - name: 🔑 Generate GitHub App token for rollback
        id: rollback-token
        if: >-
          (failure() || cancelled())
          && steps.state.outputs.safe_to_roll_back == 'true'
          && env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: ↩️ Roll back unpublished release
        id: rollback
        if: (failure() || cancelled()) && steps.state.outputs.safe_to_roll_back == 'true'
        timeout-minutes: 5
        env:
          PUSH_TOKEN: ${{ steps.rollback-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: bash .gha-workflows/.github/scripts/roll-back-release.sh

      - name: 🚨 Report release state on failure
        if: failure() || cancelled()
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          PUSHED: ${{ steps.push.outcome == 'success' }}
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          ROLLBACK_SHA: ${{ steps.rollback.outputs.sha }}
          STATE_FILE: ${{ runner.temp }}/release-state.json
        run: python3 .gha-workflows/.github/scripts/report_release_state.py

  github_release:
    name: Create GitHub Release
    needs: tagged_release
    if: (inputs.release_type != '' || inputs.release_version != '') && inputs.create_github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wait for tag to be reachable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tagged_release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          MAX_RETRIES=5
          DELAY=15
          for i in $(seq 1 "$MAX_RETRIES"); do
            if gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" --silent > /dev/null 2>&1; then
              echo "Tag $RELEASE_TAG is reachable (attempt $i/$MAX_RETRIES)"
              exit 0
            fi
            echo "Tag $RELEASE_TAG not yet reachable (attempt $i/$MAX_RETRIES). Retrying in ${DELAY}s..."
            sleep "$DELAY"
          done
          echo "::error::Tag $RELEASE_TAG was not reachable after $MAX_RETRIES attempts"
          exit 1

      # A Release that already exists (e.g. created by hand, or by an earlier run
      # in publish-only mode) is left as it is rather than overwritten.
      - name: Check for an existing Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tagged_release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          # Only a definite 404 means no Release; any other error stops here rather
          # than risk overwriting one that exists.
          if OUT=$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG" 2>&1 >/dev/null); then
            echo "::notice::A GitHub Release for $RELEASE_TAG already exists; leaving it unchanged."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif ! grep -q "HTTP 404" <<< "$OUT"; then
            echo "::error::Could not check for an existing Release for $RELEASE_TAG: $OUT"
            exit 1
          fi

      - name: Checkout release scripts
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: Create Release Notes
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tagged_release.outputs.tag_name }}
          BASE_REF: ${{ needs.tagged_release.outputs.base_ref }}
          REPO: ${{ github.repository }}
        run: |
          # GitHub's generated notes (honouring the repo's .github/release.yml),
          # regrouped by PR title type.
          ARGS=(-f tag_name="$RELEASE_TAG")
          if [ -n "$BASE_REF" ]; then ARGS+=(-f previous_tag_name="$BASE_REF"); fi
          gh api -X POST "repos/$REPO/releases/generate-notes" "${ARGS[@]}" --jq .body \
            | python3 .gha-workflows/.github/scripts/group_release_notes.py > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::GitHub returned empty release notes for $RELEASE_TAG"
            exit 1
          fi

      # github.token deliberately: a Release created with it raises no `release`
      # event, so publishing here cannot set off release-triggered workflows in
      # the calling repo. Swap in the App token if a repo needs those to fire.
      - name: Create Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.tagged_release.outputs.tag_name }}
          name: ${{ needs.tagged_release.outputs.tag_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ needs.tagged_release.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.tagged_release.outputs.is_latest }}
