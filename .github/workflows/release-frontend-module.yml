name: Release OpenMRS Frontend Module


on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use. If omitted, inferred from engines.node in package.json.'
        type: string
      build_command:
        description: 'Command to build the project. If omitted, inferred from package.json.'
        type: string
        default: ''
      enable_turborepo_cache:
        description: >-
          Deprecated and ignored. Publishing builds always run uncached so that what reaches
          the registry is built from the release tree. Retained so existing callers that pass
          it keep validating; remove it from your workflow at your convenience.
        type: string
        default: ''
      pre_release_version_command:
        description: >-
          Command to set the pre-release version.
          Available env vars: PRERELEASE_VERSION (e.g., 1.2.4-pre.42), GITHUB_RUN_NUMBER.
          If omitted, inferred from package.json.
        type: string
        default: ''
      pre_release_publish_command:
        description: 'Command to publish a pre-release from the main branch. If omitted, inferred from package.json.'
        type: string
        default: ''
      pre_release_patch_publish_command:
        description: 'Command to publish a pre-release from a patch branch. If empty, patch branch publishing is skipped.'
        type: string
        default: ''
      release_publish_command:
        description: 'Command to publish a release. If omitted, inferred from package.json.'
        type: string
        default: ''
      support_patch_branches:
        description: 'Whether to support patch/* branches for pre-releases'
        type: boolean
        default: false
      trigger_refapp_build:
        description: 'Whether to trigger the Reference Application frontend Docker image build after pre-release'
        type: boolean
        default: true
      artifact_path:
        description: 'Path(s) to build artifacts to upload (glob supported). If omitted, inferred from package.json.'
        type: string
        default: ''
      release_type:
        description: >-
          Version bump: `patch`, `minor` or `major`, applied to the version in the root
          package.json. Ignored when `release_version` is set. Setting either input cuts a
          tagged release, mirroring release-backend-module.yml: bump versions, commit, tag,
          push, publish to npm and create a GitHub Release with generated notes. When both are
          empty the workflow only pre-releases on push; it never publishes a final release.
        type: string
        default: ''
      release_version:
        description: 'Exact version to release (e.g., 12.4.0). When set, overrides release_type.'
        type: string
        default: ''
      release_version_command:
        description: >-
          Command to set the release version. Available env var: RELEASE_VERSION, which holds either
          a strategy (patch/minor/major) or an exact version; the command must accept both, as
          `yarn version` does.
          If omitted, inferred from package.json.
        type: string
        default: ''
      tag_prefix:
        description: 'Prefix for the release tag (tagged-release mode). O3 repos tag as v<version>.'
        type: string
        default: 'v'
      create_github_release:
        description: 'Whether to create a GitHub Release with release notes after publishing (tagged-release mode)'
        type: boolean
        default: true
      git_user_name:
        description: 'Git committer name for release commits (tagged-release mode)'
        type: string
        default: 'openmrs-bot'
      git_user_email:
        description: 'Git committer email for release commits (tagged-release mode)'
        type: string
        default: 'infrastructure@openmrs.org'
    secrets:
      NPM_AUTH_TOKEN:
        description: 'NPM authentication token for publishing'
        required: true
      APP_ID:
        description: >-
          GitHub App ID. Used for triggering the RefApp build (needs actions:write on
          openmrs-distro-referenceapplication) and, in tagged-release mode, for pushing the release
          commit and tag (needs contents:write on this repo and a place on the ruleset bypass list).
          When set with APP_PRIVATE_KEY, a short-lived App token is preferred over BOT_PAT.
        required: false
      APP_PRIVATE_KEY:
        description: 'Private key for the distro bot GitHub App.'
        required: false
      BOT_PAT:
        description: >-
          Legacy GitHub PAT, fallback when App credentials are not provided. Needs actions:write on
          openmrs-distro-referenceapplication for the RefApp build and, in tagged-release mode,
          permission to push past branch protection on this repo.
        required: false

jobs:
  pre_release:
    name: Pre-release
    runs-on: ubuntu-latest

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.repository_owner == 'openmrs'
      && inputs.release_type == '' && inputs.release_version == ''
      && (github.ref_name == 'main' || startsWith(github.ref_name, 'patch/'))
      && (github.event.head_commit == null || !startsWith(github.event.head_commit.message, '(chore) Release'))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout inference action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openmrs/openmrs-contrib-gha-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: Infer frontend parameters
        id: params
        uses: ./.gha-workflows/.github/actions/infer-frontend-params
        with:
          node_version: ${{ inputs.node_version }}
          build_command: ${{ inputs.build_command }}
          artifact_path: ${{ inputs.artifact_path }}
          pre_release_version_command: ${{ inputs.pre_release_version_command }}
          pre_release_publish_command: ${{ inputs.pre_release_publish_command }}
          pre_release_patch_publish_command: ${{ inputs.pre_release_patch_publish_command }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.params.outputs.node_version }}
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: 🗂️ Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ steps.params.outputs.node_version }}-modules-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ steps.params.outputs.node_version }}-modules-

      - name: 📦 Install dependencies
        run: yarn install --immutable


      - name: 🏷️ Compute pre-release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          SUPPORT_PATCH: ${{ inputs.support_patch_branches }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VERSION=$(node -e "console.log(require('semver').inc(require('./package.json').version, 'patch'))")
          if [ "$REF_NAME" = "main" ] || [ "$SUPPORT_PATCH" != "true" ]; then
            echo "version=${BASE_VERSION}-pre.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${BASE_VERSION}-patch.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏷️ Set pre-release version
        run: ${{ steps.params.outputs.pre_release_version_command }}
        env:
          PRERELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: 🏗️ Run build
        run: ${{ steps.params.outputs.build_command }}

      - name: 🔧 Configure Git
        run: git config user.email "infrastructure@openmrs.org" && git config user.name "OpenMRS CI"

      - name: 💾 Commit version changes
        run: git add . && git commit -m "Prerelease version" --no-verify

      - name: 📤 Publish pre-release (main)
        if: github.ref_name == 'main'
        run: yarn config set npmAuthToken "${NODE_AUTH_TOKEN}" && ${{ steps.params.outputs.pre_release_publish_command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: 📤 Publish pre-release (patch)
        if: >-
          inputs.support_patch_branches
          && startsWith(github.ref_name, 'patch/')
          && steps.params.outputs.pre_release_patch_publish_command != ''
        run: yarn config set npmAuthToken "${NODE_AUTH_TOKEN}" && ${{ steps.params.outputs.pre_release_patch_publish_command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-packages
          path: ${{ steps.params.outputs.artifact_path }}
          overwrite: true

  deploy:
    name: Trigger deployment
    runs-on: ubuntu-latest
    needs: pre_release
    env:
      HAS_APP_CREDS: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      HAS_CREDS: ${{ (secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '') || secrets.BOT_PAT != '' }}
      PARTIAL_APP_CREDS: ${{ (secrets.APP_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}

    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.repository_owner == 'openmrs'
      && github.ref_name == 'main'
      && inputs.trigger_refapp_build
      && inputs.release_type == '' && inputs.release_version == ''

    steps:
      - name: 🔒 Reject partial App credentials
        if: env.PARTIAL_APP_CREDS == 'true'
        run: |
          echo "::error::APP_ID and APP_PRIVATE_KEY must be set together — got one without the other. Check for a typo in the caller's secret names."
          exit 1

      - name: 🔒 Verify cross-repo dispatch credentials
        if: env.HAS_CREDS != 'true'
        run: |
          echo "::error::Triggering the RefApp build needs cross-repo credentials: set APP_ID + APP_PRIVATE_KEY (preferred) or BOT_PAT. github.token cannot dispatch to another repository."
          exit 1

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: openmrs
          repositories: openmrs-distro-referenceapplication

      - name: 🚀 Trigger RefApp Frontend Docker Image Build
        run: gh workflow run build-frontend.yml --repo openmrs/openmrs-distro-referenceapplication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BOT_PAT }}

  # ---------------------------------------------------------------------------
  # Tagged-release mode (inputs.release_type or inputs.release_version set). Mirrors
  # release-backend-module.yml: bump -> commit -> tag -> build -> push ->
  # publish -> GitHub Release with notes. This is the only path that publishes a
  # final release; there is no longer an event-driven `release` job.
  # ---------------------------------------------------------------------------
  tagged_release:
    name: Release to npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: (inputs.release_type != '' || inputs.release_version != '') && github.repository_owner == 'openmrs'
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}
      base_ref: ${{ steps.prev.outputs.base_ref }}
    env:
      HAS_APP_CREDS: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      PARTIAL_APP_CREDS: ${{ (secrets.APP_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}
    steps:
      - name: 🔒 Reject partial App credentials
        if: env.PARTIAL_APP_CREDS == 'true'
        run: |
          echo "::error::APP_ID and APP_PRIVATE_KEY must be set together — got one without the other. Check for a typo in the caller's secret names."
          exit 1

      - name: Resolve branch
        id: branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Releases are only cut from the default branch for now. Releasing from
          # other branches needs a non-`latest` npm dist-tag, which isn't handled yet.
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Releases can only be cut from '$DEFAULT_BRANCH' (this run is on '$REF_NAME'). Pick '$DEFAULT_BRANCH' in the 'Use workflow from' dropdown."
            exit 1
          fi
          echo "name=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "- **Target Branch:** \`$DEFAULT_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ steps.app-token.outputs.token || secrets.BOT_PAT || github.token }}

      - name: Checkout inference action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openmrs/openmrs-contrib-gha-workflows
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: Infer frontend parameters
        id: params
        uses: ./.gha-workflows/.github/actions/infer-frontend-params
        with:
          node_version: ${{ inputs.node_version }}
          build_command: ${{ inputs.build_command }}
          artifact_path: ${{ inputs.artifact_path }}
          release_publish_command: ${{ inputs.release_publish_command }}
          release_version_command: ${{ inputs.release_version_command }}
          resolve_pre_release: 'false'

      # `run: ${{ ... }}` with an empty value is a no-op step that PASSES. If the
      # inference action resolves a command to nothing (checked out from the wrong
      # ref, or too old to provide it), the release would tag without bumping, or
      # push a tag having published nothing. Fail here instead.
      - name: Verify inferred commands
        env:
          BUILD_COMMAND: ${{ steps.params.outputs.build_command }}
          RELEASE_VERSION_COMMAND: ${{ steps.params.outputs.release_version_command }}
          RELEASE_PUBLISH_COMMAND: ${{ steps.params.outputs.release_publish_command }}
        run: |
          STATUS=0
          for NAME in BUILD_COMMAND RELEASE_VERSION_COMMAND RELEASE_PUBLISH_COMMAND; do
            if [ -z "${!NAME}" ]; then
              echo "::error::infer-frontend-params resolved $NAME to an empty string. Is the action checked out at the right ref, and new enough to provide it?"
              STATUS=1
            fi
          done
          exit $STATUS

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.params.outputs.node_version }}
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🔧 Configure Git
        env:
          GIT_USER_NAME: ${{ inputs.git_user_name }}
          GIT_USER_EMAIL: ${{ inputs.git_user_email }}
        run: |
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"

      - name: Resolve release argument
        id: arg
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.release_version }}
        run: |
          # A custom version, when given, overrides the release type.
          if [ -n "$CUSTOM_VERSION" ]; then
            ARG="$CUSTOM_VERSION"
            LABEL="custom"
          else
            case "$RELEASE_TYPE" in
              patch|minor|major) ARG="$RELEASE_TYPE"; LABEL="$RELEASE_TYPE" ;;
              *)
                echo "::error::release_type must be patch, minor or major (got '$RELEASE_TYPE'), or set release_version"
                exit 1 ;;
            esac
          fi
          echo "value=$ARG" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "current=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The version command accepts a strategy (patch/minor/major) or an exact
      # version, the same as `yarn release <type|version>` locally.
      - name: 🏷️ Set release version
        env:
          RELEASE_VERSION: ${{ steps.arg.outputs.value }}
        run: ${{ steps.params.outputs.release_version_command }}

      - name: 🔍 Read back release version
        id: bump
        env:
          RELEASE_TYPE: ${{ steps.arg.outputs.label }}
          OLD: ${{ steps.arg.outputs.current }}
        run: |
          NEW=$(node -p "require('./package.json').version")
          if [[ ! "$NEW" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version after bump is '$NEW', expected stable semver like 12.4.0 (no 'v' prefix, no pre-release suffix)"
            exit 1
          fi
          if [ "$(node -p "require('semver').gt('$NEW', '$OLD')")" != "true" ]; then
            echo "::error::New version $NEW is not greater than current version $OLD"
            exit 1
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          {
            echo "### Release Parameters 🚀"
            echo "- **Release Type:** \`$RELEASE_TYPE\`"
            echo "- **Version:** \`$OLD\` → \`$NEW\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute release tag name
        id: tag
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          TAG_NAME="${TAG_PREFIX}${RELEASE_VERSION}"
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "- **Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tag does not exist
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists. Release aborted to prevent overwriting."
            exit 1
          fi

      - name: Resolve previous release tag
        id: prev
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Base for release notes: the latest stable release older than this one,
          # so a patch-branch release doesn't diff against a newer main-line tag.
          # The selector already tolerates an optional leading `v`, so strip a
          # plain `v` prefix and let it match both `v1.2.3` and `1.2.3` tags.
          if [ "$TAG_PREFIX" = "v" ]; then TAG_PREFIX=""; fi
          git tag --list "${TAG_PREFIX}*" \
            | TAG_PREFIX="$TAG_PREFIX" python3 .gha-workflows/.github/scripts/select_previous_release.py

      - name: 💾 Commit and tag
        env:
          RELEASE_VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          # "(chore) Release" prefix keeps the pre_release job from firing on this push.
          git add -A
          git commit -m "(chore) Release v${RELEASE_VERSION}" --no-verify
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"

      - name: 🏗️ Run build
        run: ${{ steps.params.outputs.build_command }}

      - name: ⬆️ Push release commit and tag
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          # Push before publishing: npm versions are immutable, so a failed push
          # after a publish would leave an untagged version on the registry.
          # --atomic makes the branch and tag land together or not at all.
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$RELEASE_TAG"

      - name: 📢 Publish release
        run: yarn config set npmAuthToken "${NODE_AUTH_TOKEN}" && ${{ steps.params.outputs.release_publish_command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-packages
          path: ${{ steps.params.outputs.artifact_path }}
          overwrite: true

  github_release:
    name: Create GitHub Release
    needs: tagged_release
    if: (inputs.release_type != '' || inputs.release_version != '') && inputs.create_github_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wait for tag to be reachable
        env:
          RELEASE_TAG: ${{ needs.tagged_release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          MAX_RETRIES=5
          DELAY=15
          for i in $(seq 1 "$MAX_RETRIES"); do
            if git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$RELEASE_TAG" > /dev/null 2>&1; then
              echo "Tag $RELEASE_TAG is reachable (attempt $i/$MAX_RETRIES)"
              exit 0
            fi
            echo "Tag $RELEASE_TAG not yet reachable (attempt $i/$MAX_RETRIES). Retrying in ${DELAY}s..."
            sleep "$DELAY"
          done
          echo "::error::Tag $RELEASE_TAG was not reachable after $MAX_RETRIES attempts"
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.tagged_release.outputs.tag_name }}

      - name: Create Release Notes
        uses: openmrs/openmrs-contrib-create-release-notes@6b8ad87592ae0bdbcbfde8d740493d6f34bc8e97 # v2.1.0
        id: create-release-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          head-ref: refs/tags/${{ needs.tagged_release.outputs.tag_name }}
          base-ref: ${{ needs.tagged_release.outputs.base_ref && format('refs/tags/{0}', needs.tagged_release.outputs.base_ref) || '' }}

      # github.token deliberately: a Release created with it raises no `release`
      # event, so publishing here cannot set off release-triggered workflows in
      # the calling repo. Swap in the App token if a repo needs those to fire.
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.tagged_release.outputs.tag_name }}
          name: ${{ needs.tagged_release.outputs.tag_name }}
          body: |
            ## What's Changed

            ${{ steps.create-release-notes.outputs.release-notes }}
          draft: false
          prerelease: false
          make_latest: true
