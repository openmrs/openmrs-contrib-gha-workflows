name: Release OpenMRS Maven Module

on:
  workflow_call:
    inputs:
      release_version:
        description: 'Release version (e.g., 1.3.3 or 1.4.0-beta.1). If omitted, the POM version without -SNAPSHOT.'
        type: string
        default: ''
      development_version:
        description: 'Next development version (e.g., 1.4.0-SNAPSHOT). If omitted, a pre-release such as X.Y.Z-beta.1 continues as X.Y.Z-SNAPSHOT, an X.Y.0 release as X.(Y+1).0-SNAPSHOT, and maven-release-plugin picks any other.'
        type: string
        default: ''
      java_version:
        description: 'Java version to use for the release. If omitted, inferred from Maven compiler settings in pom.xml.'
        type: string
      java_distribution:
        description: 'Java distribution'
        type: string
        default: 'temurin'
      git_user_name:
        description: 'Git committer name for release commits'
        type: string
        default: 'openmrs-bot'
      git_user_email:
        description: 'Git committer email for release commits'
        type: string
        default: 'infrastructure@openmrs.org'
      branch:
        description: 'Branch to release from. If omitted, uses the branch that triggered the workflow.'
        type: string
        required: false
      maven_release_server_id:
        description: 'Maven server ID for release deployment. If omitted, inferred from <distributionManagement><repository><id> in pom.xml.'
        type: string
        required: false
      maven_snapshot_server_id:
        description: 'Maven server ID for snapshot deployment. If omitted, inferred from <distributionManagement><snapshotRepository><id> in pom.xml.'
        type: string
        required: false
      maven_release_repository_url:
        description: 'Repository URL to deploy the release to instead of <distributionManagement><repository>.'
        type: string
        default: ''
      maven_snapshot_repository_url:
        description: 'Repository URL to deploy the next SNAPSHOT to instead of <distributionManagement><snapshotRepository>.'
        type: string
        default: ''
      maven_profiles:
        description: 'Comma-separated Maven profiles to activate in the release builds (e.g. release,sign).'
        type: string
        default: ''
      create_github_release:
        description: 'Whether to create a GitHub Release with release notes after Maven release'
        type: boolean
        default: true
    secrets:
      MAVEN_REPO_USERNAME:
        description: 'Maven repository username'
        required: true
      MAVEN_REPO_API_KEY:
        description: 'Maven repository API key / password'
        required: true
      GPG_PRIVATE_KEY:
        description: 'ASCII-armored GPG private key for signing release artifacts. When omitted, artifacts are not signed.'
        required: false
      GPG_PASSPHRASE:
        description: 'Passphrase for the GPG private key'
        required: false
      APP_ID:
        description: 'GitHub App ID for the module release bot. When set with APP_PRIVATE_KEY, a short-lived App token is preferred over BOT_PAT. The App must be on the target ruleset bypass list to push past branch protection.'
        required: false
      APP_PRIVATE_KEY:
        description: 'Private key for the module release bot GitHub App.'
        required: false
      BOT_PAT:
        description: 'Legacy Personal Access Token for bypassing branch protections. Fallback when App credentials are not provided.'
        required: false

jobs:
  release:
    name: Release to Maven
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: release-${{ github.repository }}-${{ inputs.branch || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}
      base_ref: ${{ steps.prev.outputs.base_ref }}
      release_version: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.prev.outputs.prerelease }}
      released: ${{ steps.release.outputs.released }}
    env:
      HAS_APP_CREDS: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      PARTIAL_APP_CREDS: ${{ (secrets.APP_ID != '') != (secrets.APP_PRIVATE_KEY != '') }}

    steps:
      - name: 🔒 Reject partial App credentials
        if: env.PARTIAL_APP_CREDS == 'true'
        run: |
          echo "::error::APP_ID and APP_PRIVATE_KEY must be set together — got one without the other. Check for a typo in the caller's secret names."
          exit 1

      - name: 🔒 Verify Maven credentials
        env:
          MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
          MAVEN_REPO_API_KEY: ${{ secrets.MAVEN_REPO_API_KEY }}
        run: |
          if [ -z "$MAVEN_REPO_USERNAME" ] || [ -z "$MAVEN_REPO_API_KEY" ]; then
            echo "::error::Releasing needs both MAVEN_REPO_USERNAME and MAVEN_REPO_API_KEY. Check the caller passes secrets that exist."
            exit 1
          fi

      - name: Resolve branch
        id: branch
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A version branch (e.g. 2.x) is checked against the release version once
          # that is resolved from the POM.
          if [ -n "$INPUT_BRANCH" ]; then
            echo "name=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          elif echo "$REF_NAME" | grep -qE '^[0-9]+\.x$|^[0-9]+\.[0-9]+\.x$'; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version_prefix=${REF_NAME%.x}." >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cannot auto-detect release branch from '$REF_NAME'. Provide the branch explicitly."
            exit 1
          fi

      - name: Validate branch
        run: |
          # Ensure branch name contains only valid git branch characters
          if [[ ! "$BRANCH" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::Branch name '$BRANCH' contains invalid characters. Only alphanumeric, '.', '_', '/' and '-' are allowed."
            exit 1
          fi
          # Verify the branch exists in the remote repository
          if ! gh api "repos/$REPO/git/ref/heads/$BRANCH" --silent > /dev/null 2>&1; then
            echo "::error::Branch '$BRANCH' does not exist in $REPO"
            exit 1
          fi

          echo "- **Target Branch:** \`$BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

          echo "Branch validated: $BRANCH exists in $REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          REPO: ${{ github.repository }}

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ steps.app-token.outputs.token || secrets.BOT_PAT || github.token }}

      - name: Checkout shared actions and scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            .github/actions
            .github/scripts
          sparse-checkout-cone-mode: false
          path: .gha-workflows

      - name: Infer backend parameters
        id: infer
        uses: ./.gha-workflows/.github/actions/infer-backend-params
        with:
          main_java_version: ${{ inputs.java_version }}
          snapshot_server_id: ${{ inputs.maven_snapshot_server_id }}
          release_server_id: ${{ inputs.maven_release_server_id }}
          maven_profiles: ${{ inputs.maven_profiles }}

      - name: Resolve versions
        id: version
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          DEVELOPMENT_VERSION: ${{ inputs.development_version }}
          POM_VERSION: ${{ steps.infer.outputs.project_version }}
          VERSION_PREFIX: ${{ steps.branch.outputs.version_prefix }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          RELEASE_VERSION="$INPUT_RELEASE_VERSION"
          if [ -z "$RELEASE_VERSION" ]; then
            if [[ ! "$POM_VERSION" =~ -SNAPSHOT$ ]]; then
              echo "::error::The POM version '$POM_VERSION' is not a SNAPSHOT, so the release version cannot be inferred. Provide release_version."
              exit 1
            fi
            RELEASE_VERSION="${POM_VERSION%-SNAPSHOT}"
          fi

          SEMVER_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)){0,1}(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)){0,1}$'
          if [[ ! "$RELEASE_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Release version '$RELEASE_VERSION' is not valid semver (e.g., 1.3.3)"
            exit 1
          fi
          if [[ "$RELEASE_VERSION" =~ -[Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt]$ ]]; then
            echo "::error::Release version '$RELEASE_VERSION' cannot be a SNAPSHOT"
            exit 1
          fi
          if [[ -n "$DEVELOPMENT_VERSION" && ! "$DEVELOPMENT_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Development version '$DEVELOPMENT_VERSION' is not valid semver (e.g., 1.4.0-SNAPSHOT)"
            exit 1
          fi
          if [[ -n "$VERSION_PREFIX" && "$RELEASE_VERSION" != "$VERSION_PREFIX"* ]]; then
            echo "::error::Branch '$BRANCH' does not match release version '$RELEASE_VERSION' (expected prefix '$VERSION_PREFIX'). Provide the branch explicitly."
            exit 1
          fi

          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### Release Parameters 🚀"
            echo "- **Release Version:** \`$RELEASE_VERSION\`"
            echo "- **Next Development Version:** \`${DEVELOPMENT_VERSION:-inferred}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔒 Check release target
        id: target
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TARGET_URL: >-
            ${{ inputs.maven_release_repository_url || steps.infer.outputs.release_repository_url }}
            ${{ inputs.maven_snapshot_repository_url || steps.infer.outputs.snapshot_repository_url }}
          GROUP_IDS: ${{ steps.infer.outputs.group_ids }}
          CENTRAL_PUBLISHING: ${{ steps.infer.outputs.central_publishing }}
        run: python3 .gha-workflows/.github/scripts/maven_publish_checks.py target

      - name: 🔒 Reject OpenMRS-owned release target
        if: steps.target.outputs.allowed != 'true'
        env:
          REASON: ${{ steps.target.outputs.reason }}
        run: |
          echo "::error::Only repositories in the openmrs org can release here: $REASON. Set maven_release_repository_url and maven_snapshot_repository_url, or <distributionManagement> in the POM, to your own repositories."
          exit 1

      - name: 🔒 Check POM scm
        id: scm
        env:
          SCM_CONNECTIONS: ${{ steps.infer.outputs.scm_connections }}
        run: python3 .gha-workflows/.github/scripts/maven_publish_checks.py scm

      - name: Resolve Java version
        id: java
        env:
          INFERRED_JAVA_VERSION: ${{ steps.infer.outputs.main_java_version }}
        run: |
          echo "version=${INFERRED_JAVA_VERSION:-8}" >> "$GITHUB_OUTPUT"

      - name: Resolve Maven release server ID
        id: release-server
        env:
          INFERRED_RELEASE_ID: ${{ steps.infer.outputs.release_server_id }}
        run: |
          echo "id=${INFERRED_RELEASE_ID:-openmrs-repo-modules}" >> "$GITHUB_OUTPUT"

      - name: Resolve Maven snapshot server ID
        id: snapshot-server
        env:
          INFERRED_SNAPSHOT_ID: ${{ steps.infer.outputs.snapshot_server_id }}
        run: |
          echo "id=${INFERRED_SNAPSHOT_ID:-openmrs-repo-snapshots}" >> "$GITHUB_OUTPUT"

      - name: Compute release tag name
        id: tag
        env:
          TAG_FORMAT: ${{ steps.infer.outputs.release_tag_format }}
          ARTIFACT_ID: ${{ steps.infer.outputs.project_artifact_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          # Resolve the maven-release-plugin tag name by substituting the
          # placeholders the plugin supports for the values it would use at
          # release time (artifactId is stable; version is the release version).
          TAG_NAME="$TAG_FORMAT"
          TAG_NAME="${TAG_NAME//@\{project.artifactId\}/$ARTIFACT_ID}"
          TAG_NAME="${TAG_NAME//@\{project.version\}/$RELEASE_VERSION}"
          if [[ "$TAG_NAME" == *"@{"* ]]; then
            echo "::error::Unresolved placeholder in release tag name '$TAG_NAME' (format: '$TAG_FORMAT'). Only @{project.artifactId} and @{project.version} are supported."
            exit 1
          fi
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "- **Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Computed release tag name: $TAG_NAME"

          # The prefix shared by every release tag of this artifact: the tag
          # format with the artifactId substituted and everything from the
          # version placeholder onward dropped. Used to find this artifact's
          # prior releases without matching other artifacts in the repo.
          PREFIX="$TAG_FORMAT"
          PREFIX="${PREFIX//@\{project.artifactId\}/$ARTIFACT_ID}"
          PREFIX="${PREFIX%%@\{project.version\}*}"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Resolve previous release tag
        id: prev
        env:
          TAG_PREFIX: ${{ steps.tag.outputs.prefix }}
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          # Pick the comparison base for release notes: this artifact's latest
          # stable release older than the one being cut (or than its core
          # version, for a pre-release such as 1.4.0-beta.1). Passing it explicitly
          # keeps create-release-notes from defaulting to the repo-wide latest
          # release, which may belong to another active line (e.g. a 3.x tag
          # while cutting 2.5.4 from the 2.x branch). Empty output is fine — the
          # action then falls back to its default behavior.
          git tag --list "${TAG_PREFIX}*" \
            | python3 .gha-workflows/.github/scripts/select_previous_release.py

      - name: Set up Java ${{ steps.java.outputs.version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: ${{ inputs.java_distribution }}
          cache: maven
          overwrite-settings: false

      - name: Set up Maven settings
        env:
          RELEASE_ID: ${{ steps.release-server.outputs.id }}
          SNAPSHOT_ID: ${{ steps.snapshot-server.outputs.id }}
        run: |
          for id in "$RELEASE_ID" "$SNAPSHOT_ID"; do
            if [[ ! "$id" =~ ^[a-zA-Z0-9._-]+$ ]]; then
              echo "::error::Maven server ID '$id' contains invalid characters"
              exit 1
            fi
          done
          mkdir -p "$HOME/.m2"
          # Maven, not the shell, expands ${env.*}; a shared release/snapshot id is written once.
          # shellcheck disable=SC2016
          {
            echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"'
            echo '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"'
            echo '  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">'
            echo '  <servers>'
            for id in $(printf '%s\n' "$RELEASE_ID" "$SNAPSHOT_ID" | sort -u); do
              echo "    <server>"
              echo "      <id>$id</id>"
              echo '      <username>${env.MAVEN_REPO_USERNAME}</username>'
              echo '      <password>${env.MAVEN_REPO_API_KEY}</password>'
              echo "    </server>"
            done
            echo '  </servers>'
            echo '</settings>'
          } > "$HOME/.m2/settings.xml"

      - name: Verify tag does not exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists. Release aborted to prevent overwriting."
            exit 1
          fi
          mvn release:clean -B 2>/dev/null || true
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}

      - name: Resolve maven-release-plugin version
        id: release-plugin
        env:
          DECLARED_VERSION: ${{ steps.infer.outputs.release_plugin_version }}
        run: |
          # An empty project's effective POM shows the version Maven's super POM pins,
          # so a version the project chose can be told apart from Maven's default.
          EMPTY="$RUNNER_TEMP/empty-project"
          mkdir -p "$EMPTY"
          echo '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>empty</groupId><artifactId>empty</artifactId><version>1</version><packaging>pom</packaging></project>' > "$EMPTY/pom.xml"
          mvn -B -q -f "$EMPTY/pom.xml" help:effective-pom -Doutput="$EMPTY/effective-pom.xml"
          SUPER_EFFECTIVE_POM="$EMPTY/effective-pom.xml" python3 .gha-workflows/.github/scripts/resolve_release_plugin.py

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          else
            echo "No GPG_PRIVATE_KEY secret provided; skipping import. Artifacts will not be signed."
          fi

      - name: Release prepare and perform
        id: release
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          # Send maven-release-plugin's pushes and checkouts to this repository, whatever the POM's <scm> says.
          for url in $SCM_URLS; do
            git config --global --add url."https://github.com/$REPO.git".insteadOf "$url"
          done
          git config --global user.email "$GIT_USER_EMAIL"
          git config --global user.name "$GIT_USER_NAME"
          export MAVEN_OPTS="-Denv.MAVEN_REPO_USERNAME=$MAVEN_REPO_USERNAME -Denv.MAVEN_REPO_API_KEY=$MAVEN_REPO_API_KEY"
          # Tests are skipped: they run in the build workflow before a release is cut.
          ARGS=(-r "$RELEASE_VERSION" -v "$RELEASE_PLUGIN_VERSION" -s)
          if [ -n "$DEVELOPMENT_VERSION" ]; then ARGS+=(-d "$DEVELOPMENT_VERSION"); fi
          IFS=',' read -ra PROFILE_LIST <<< "$MAVEN_PROFILES"
          for profile in "${PROFILE_LIST[@]}"; do
            profile="$(echo "$profile" | xargs)"
            if [ -n "$profile" ]; then ARGS+=(-p "$profile"); fi
          done
          # id::default::url is the alternate-repository syntax both deploy plugin 2.8.x and 3.x accept.
          if [ -n "$RELEASE_URL" ]; then ARGS+=(-D "altReleaseDeploymentRepository=$RELEASE_ID::default::$RELEASE_URL"); fi
          if [ -n "$SNAPSHOT_URL" ]; then ARGS+=(-D "altSnapshotDeploymentRepository=$SNAPSHOT_ID::default::$SNAPSHOT_URL"); fi
          bash .gha-workflows/.github/scripts/maven-release.sh "${ARGS[@]}"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
          DEVELOPMENT_VERSION: ${{ inputs.development_version }}
          RELEASE_PLUGIN_VERSION: ${{ steps.release-plugin.outputs.version }}
          MAVEN_PROFILES: ${{ inputs.maven_profiles }}
          RELEASE_ID: ${{ steps.release-server.outputs.id }}
          SNAPSHOT_ID: ${{ steps.snapshot-server.outputs.id }}
          RELEASE_URL: ${{ inputs.maven_release_repository_url }}
          SNAPSHOT_URL: ${{ inputs.maven_snapshot_repository_url }}
          SCM_URLS: ${{ steps.scm.outputs.urls }}
          REPO: ${{ github.repository }}
          GIT_USER_NAME: ${{ inputs.git_user_name }}
          GIT_USER_EMAIL: ${{ inputs.git_user_email }}
          MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
          MAVEN_REPO_API_KEY: ${{ secrets.MAVEN_REPO_API_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  github-release:
    name: Create GitHub Release
    needs: release
    # A release whose follow-up SNAPSHOT deploy failed still gets its GitHub Release.
    if: ${{ !cancelled() && inputs.create_github_release && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Wait for tag to be reachable
        run: |
          MAX_RETRIES=5
          DELAY=15
          for i in $(seq 1 "$MAX_RETRIES"); do
            if gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" --silent > /dev/null 2>&1; then
              echo "Tag $RELEASE_TAG is reachable (attempt $i/$MAX_RETRIES)"
              exit 0
            fi
            echo "Tag $RELEASE_TAG not yet reachable (attempt $i/$MAX_RETRIES). Retrying in ${DELAY}s..."
            sleep "$DELAY"
          done
          echo "::error::Tag $RELEASE_TAG was not reachable after $MAX_RETRIES attempts"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
          REPO: ${{ github.repository }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.release.outputs.tag_name }}

      - name: Create Release Notes
        uses: openmrs/openmrs-contrib-create-release-notes@6b8ad87592ae0bdbcbfde8d740493d6f34bc8e97 # v2.1.0
        id: create-release-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          head-ref: refs/tags/${{ needs.release.outputs.tag_name }}
          base-ref: ${{ needs.release.outputs.base_ref && format('refs/tags/{0}', needs.release.outputs.base_ref) || '' }}

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          name: ${{ needs.release.outputs.release_version }}
          body: |
            ## What's Changed
            ${{ steps.create-release-notes.outputs.release-notes }}
          draft: false
          prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
