version: 2
updates:
  # Keeps the pinned action SHAs current across both the reusable workflows in
  # .github/workflows and the composite actions in .github/actions. The
  # smoke-test workflow exercises a bumped action before the grouped PR merges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  # The documentation site's dependencies, kept apart from the action pins so
  # docs bumps never ride along with workflow changes.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns:
          - "*"
    commit-message:
      prefix: docs

  # npm packages the workflows install for their own use (e.g. semver), pinned
  # so every calling repository gets the same versions.
  - package-ecosystem: npm
    directory: /.github/tools
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
